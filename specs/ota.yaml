design: ota_5t
pdk: sky130A

schematic:
  cell_name: ota_5t
  cell_netlist: circuits/ota/schematic/ota_5t.spice

layout:
  cell_name: ota_5t
  magic_dir: circuits/ota/layout/magic
  extracted_netlist: circuits/ota/layout/extracted/ota_5t_extracted.spice

supply_v: 1.8
temperature_c: 27
load_cap_f: 2.0e-12
common_mode_v: 0.9
bias_tail_v: 0.7

targets:
  dc_gain_db:
    min: 40
  unity_gain_hz:
    min: 5.0e6
  phase_margin_deg:
    min: 60
  power_w:
    max: 5.0e-4

simulation:
  corner: tt
  model_lib: "$PDK_ROOT/$PDK/libs.tech/ngspice/sky130.lib.spice"
  ac_start_hz: 1
  ac_stop_hz: 1.0e9
  ac_points_per_decade: 20

evaluation:
  cases:
    nominal_tt_27c_1v8:
      description: Nominal schematic-level OTA check.
      overrides:
        simulation.corner: tt
        temperature_c: 27
        supply_v: 1.8
        load_cap_f: 2.0e-12
    slow_ss_85c_1v62:
      description: Slow, hot, low-supply corner.
      overrides:
        simulation.corner: ss
        temperature_c: 85
        supply_v: 1.62
        load_cap_f: 2.0e-12
    fast_ff_m40c_1v98:
      description: Fast, cold, high-supply corner.
      overrides:
        simulation.corner: ff
        temperature_c: -40
        supply_v: 1.98
        load_cap_f: 2.0e-12
    heavy_load_tt_27c_1v8:
      description: Nominal process with heavier capacitive load.
      overrides:
        simulation.corner: tt
        temperature_c: 27
        supply_v: 1.8
        load_cap_f: 5.0e-12

devices:
  mn_in:
    model: sky130_fd_pr__nfet_01v8
    w_um: 15.12
    l_um: 1.05
    m: 2
  mp_load:
    model: sky130_fd_pr__pfet_01v8
    w_um: 22
    l_um: 1.05
    m: 2
  mn_tail:
    model: sky130_fd_pr__nfet_01v8
    w_um: 8
    l_um: 1.0
    m: 1
